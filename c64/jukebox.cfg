# Le programme est chargé à $0801 (lanceur BASIC + copieur), puis recopié et exécuté à $A900 (HISTART) :
# tout le reste de la mémoire ($0800-$A8FF) est libre pour le morceau reçu.
FEATURES {
    STARTADDRESS: default = $0801;
}
SYMBOLS {
    __LOADADDR__:  type = import;
    __EXEHDR__:    type = import;
    __STACKSIZE__: type = weak, value = $0200;
    __HIMEM__:     type = weak, value = $D000;
    __HISTART__:   type = weak, value = $A900;
    __LOADSIZE__:  type = weak, value = $2800;
}
MEMORY {
    ZP:       file = "", define = yes, start = $0002,           size = $001A;
    LOADADDR: file = %O,               start = %S - 2,          size = $0002;
    HEADER:   file = %O, define = yes, start = %S,              size = $000D;
    MAIN:     file = %O, define = yes, start = __HEADER_LAST__, size = $0040, fill = yes;
    LOADIMG:  file = %O, define = yes, start = __HEADER_LAST__ + $0040, size = __LOADSIZE__;
    HI:       file = "", define = yes, start = __HISTART__,     size = __HIMEM__ - __HISTART__ - __STACKSIZE__;
    BSS:      file = "",               start = __ONCE_RUN__,    size = __HIMEM__ - __STACKSIZE__ - __ONCE_RUN__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    EXEHDR:   load = HEADER,   type = ro;
    BOOT:     load = MAIN,     type = ro;
    STARTUP:  load = LOADIMG, run = HI, type = ro, define = yes;
    LOWCODE:  load = LOADIMG, run = HI, type = ro, optional = yes;
    CODE:     load = LOADIMG, run = HI, type = ro;
    RODATA:   load = LOADIMG, run = HI, type = ro;
    DATA:     load = LOADIMG, run = HI, type = rw, define = yes;
    INIT:     load = LOADIMG, run = HI, type = rw;
    ONCE:     load = LOADIMG, run = HI, type = ro, define = yes;
    BSS:      load = BSS,      type = bss, define = yes;
}
FEATURES {
    CONDES: type    = constructor,
            label   = __CONSTRUCTOR_TABLE__,
            count   = __CONSTRUCTOR_COUNT__,
            segment = ONCE;
    CONDES: type    = destructor,
            label   = __DESTRUCTOR_TABLE__,
            count   = __DESTRUCTOR_COUNT__,
            segment = RODATA;
    CONDES: type    = interruptor,
            label   = __INTERRUPTOR_TABLE__,
            count   = __INTERRUPTOR_COUNT__,
            segment = RODATA,
            import  = __CALLIRQ__;
}
