# Partie assembleur (lecteur, logo, scroller) : image brute liée à __HISTART__, placée en tête de la zone résidente.
SYMBOLS { __HISTART__: type = weak, value = $A700; }
MEMORY { ASM: file = %O, start = __HISTART__, size = $1800; }
SEGMENTS {
    CODE:   load = ASM, type = ro;
    RODATA: load = ASM, type = ro;
    BSS:    load = ASM, type = rw;
}
